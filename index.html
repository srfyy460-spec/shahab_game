
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>بازی سکه شهاب</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #10172e, #25205b);
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    .game {
      width: 85%;
      max-width: 360px;
      padding: 25px;
      border-radius: 25px;
      background: #ffffff12;
      border: 1px solid #ffffff25;
    }

    h1 { color: #ffd54a; }

    .score {
      font-size: 38px;
      font-weight: bold;
      margin: 20px;
    }

    .coin {
      font-size: 100px;
      background: none;
      border: none;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .coin:active { transform: scale(0.85); }

    button {
      color: white;
      border: none;
      border-radius: 14px;
      padding: 13px 20px;
      font-size: 17px;
    }

    .upgrade {
      background: #7657ff;
      width: 100%;
      margin-top: 15px;
    }

    .note {
      color: #d1d5ff;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="game">
    <h1>🪙 سکه‌های شهاب</h1>
    <p>روی سکه بزن و امتیاز بگیر!</p>

    <div>موجودی سکه</div>
    <div class="score" id="score">0</div>

    <button class="coin" id="coin"
            aria-label="گرفتن سکه">🪙</button>

    <p id="power">قدرت هر ضربه: 1</p>

    <button class="upgrade" id="upgrade">
      ⚡ افزایش قدرت — هزینه: 50
    </button>

    <p class="note">رکورد روی همین دستگاه ذخیره می‌شود.</p>
    <p id="best">رکورد: 0</p>
  </main>

  <script>
    const tg = window.Telegram?.WebApp;
    tg?.ready();
    tg?.expand();

    let score = Number(localStorage.getItem("shahab_score")) || 0;
    let power = Number(localStorage.getItem("shahab_power")) || 1;
    let best = Number(localStorage.getItem("shahab_best")) || 0;

    const scoreEl = document.getElementById("score");
    const powerEl = document.getElementById("power");
    const bestEl = document.getElementById("best");
    const upgradeBtn = document.getElementById("upgrade");

    function render() {
      scoreEl.textContent = score;
      powerEl.textContent = "قدرت هر ضربه: " + power;
      bestEl.textContent = "رکورد: " + best;
      upgradeBtn.textContent =
        "⚡ افزایش قدرت — هزینه: " + (power * 50);
    }

    document.getElementById("coin").onclick = () => {
      score += power;
      if (score > best) best = score;

      localStorage.setItem("shahab_score", score);
      localStorage.setItem("shahab_power", power);
      localStorage.setItem("shahab_best", best);

      tg?.HapticFeedback?.impactOccurred("light");
      render();
    };

    upgradeBtn.onclick = () => {
      const cost = power * 50;

      if (score >= cost) {
        score -= cost;
        power++;

        localStorage.setItem("shahab_score", score);
        localStorage.setItem("shahab_power", power);
        render();
      } else {
        alert("سکه کافی نداری! بیشتر بازی کن.");
      }
    };

    render();
  </script>
</body>
</html>
